name: ayad-network-manager

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayad_network_manager}
      POSTGRES_USER: ${POSTGRES_USER:-ayad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayad} -d ${POSTGRES_DB:-ayad_network_manager}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  enforcement:
    build:
      context: .
      dockerfile: backend/deploy/enforcement/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_ENV: production
      ENFORCEMENT_SOCKET_PATH: /run/network-control/enforcement.sock
      SYSTEM_CONFIG_PATH: /etc/network-control-system/config.env
      SETUP_SNAPSHOT_DIR: /var/lib/network-control/backups
      CLIENT_INTERFACE: ${CLIENT_INTERFACE:-}
      UPLINK_INTERFACE: ${UPLINK_INTERFACE:-}
      VPN_TUN_INTERFACE: ${VPN_TUN_INTERFACE:-tun0}
      CLIENT_SUBNET: ${CLIENT_SUBNET:-}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
      SSH_PORT: ${SSH_PORT:-22}
    volumes:
      - config-data:/etc/network-control-system
      - runtime-socket:/run/network-control
      - setup-state:/var/lib/network-control
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/network-control/enforcement.sock"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/deploy/docker/backend.Dockerfile
      target: migration
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ayad_network_manager}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
    profiles:
      - migrate

  backend:
    build:
      context: .
      dockerfile: backend/deploy/docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: node
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ayad_network_manager}
      DATABASE_USER: ${POSTGRES_USER:-ayad}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-ayad_network_manager}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      ENFORCEMENT_SOCKET_PATH: /run/network-control/enforcement.sock
      SYSTEM_CONFIG_PATH: /etc/network-control-system/config.env
      SETUP_SNAPSHOT_DIR: /var/lib/network-control/backups
      FRONTEND_DIST_PATH: /frontend-dist
      TLS_CERT_PATH: /etc/network-control-system/tls/server.crt
      TLS_KEY_PATH: /etc/network-control-system/tls/server.key
    ports:
      - "${DASHBOARD_PORT:-5000}:${DASHBOARD_PORT:-5000}"
    volumes:
      - config-data:/etc/network-control-system:ro
      - runtime-socket:/run/network-control
      - setup-state:/var/lib/network-control:ro
      - ./certs:/etc/network-control-system/tls:ro
    depends_on:
      db:
        condition: service_healthy
      enforcement:
        condition: service_healthy
    networks:
      - app

volumes:
  config-data:
  runtime-socket:
  setup-state:
  db-data:

networks:
  app:
    driver: bridge
