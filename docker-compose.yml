name: ayad-network-manager

services:
  enforcement:
    image: ayad-network-manager:enforcement
    build:
      context: .
      dockerfile: backend/deploy/enforcement/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_ENV: production
      ENFORCEMENT_SOCKET_PATH: /run/network-control/enforcement.sock
      ENFORCEMENT_SOCKET_GID: ${ENFORCEMENT_SOCKET_GID:-1000}
      SYSTEM_CONFIG_PATH: /etc/network-control-system/config.env
      SETUP_SNAPSHOT_DIR: /var/lib/network-control/backups
      CLIENT_INTERFACE: ${CLIENT_INTERFACE:-}
      UPLINK_INTERFACE: ${UPLINK_INTERFACE:-}
      VPN_TUN_INTERFACE: ${VPN_TUN_INTERFACE:-tun0}
      CLIENT_SUBNET: ${CLIENT_SUBNET:-}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
      SSH_PORT: ${SSH_PORT:-22}
    volumes:
      - config-data:/etc/network-control-system
      - runtime-socket:/run/network-control
      - setup-state:/var/lib/network-control
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/network-control/enforcement.sock"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    image: ayad-network-manager:backend
    build:
      context: .
      dockerfile: backend/deploy/docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: node
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Host PostgreSQL connection}
      ENFORCEMENT_SOCKET_PATH: /run/network-control/enforcement.sock
      SYSTEM_CONFIG_PATH: /etc/network-control-system/config.env
      SETUP_SNAPSHOT_DIR: /var/lib/network-control/backups
      FRONTEND_DIST_PATH: /frontend-dist
      TLS_CERT_PATH: /etc/network-control-system/tls/server.crt
      TLS_KEY_PATH: /etc/network-control-system/tls/server.key
    network_mode: host
    volumes:
      - config-data:/etc/network-control-system
      - runtime-socket:/run/network-control
      - setup-state:/var/lib/network-control
      - ./certs:/etc/network-control-system/tls:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.DASHBOARD_PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      enforcement:
        condition: service_healthy

volumes:
  config-data:
  runtime-socket:
  setup-state:
