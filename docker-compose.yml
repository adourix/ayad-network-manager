name: ayad-network-manager

# Hybrid deployment: application in Docker, enforcement stays Host-native.
services:
  backend:
    image: ayad-network-manager:backend
    build:
      context: .
      dockerfile: backend/deploy/docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: node
    group_add:
      - "${ENFORCEMENT_SOCKET_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      ENFORCEMENT_SOCKET_PATH: /run/network-control/enforcement.sock
      SYSTEM_CONFIG_PATH: /etc/network-control-system/config.env
      SETUP_SNAPSHOT_DIR: /var/lib/network-control/backups
      FRONTEND_DIST_PATH: /frontend-dist
      TLS_CERT_PATH: /etc/network-control-system/tls/server.crt
      TLS_KEY_PATH: /etc/network-control-system/tls/server.key
    network_mode: host
    volumes:
      - /run/network-control/enforcement.sock:/run/network-control/enforcement.sock
      - /etc/network-control-system/config.env:/etc/network-control-system/config.env:ro
      - /var/lib/network-control/backups:/var/lib/network-control/backups
      - /etc/network-control-system/tls:/etc/network-control-system/tls:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.DASHBOARD_PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
