name: Docker Image CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"

jobs:
  compose-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.docker.example .env
          sed -i 's/replace-with-a-long-random-password/ci-test-password-please-change/' .env
          docker compose config --quiet

  build-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend runtime target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/docker/backend.Dockerfile
          target: runtime
          push: false
          tags: ayad-network-manager:ci
      - name: Build Prisma migration target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/docker/backend.Dockerfile
          target: migration
          push: false
          tags: ayad-network-manager-migrate:ci
      - name: Build enforcement image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/enforcement/Dockerfile
          push: false
          tags: ayad-network-manager-enforcement:ci
