name: Docker Image CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-install.sh"
      - "install.sh"
      - "backend/deploy/systemd/ayadnm-docker.service"
      - ".env.docker.example"
      - "README.md"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-install.sh"
      - "install.sh"
      - "backend/deploy/systemd/ayadnm-docker.service"
      - ".env.docker.example"
      - "README.md"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"

jobs:
  compose-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Docker installer syntax
        run: |
          bash -n install.sh
          bash -n docker-install.sh
      - name: Validate Compose configuration
        run: |
          cp .env.docker.example .env
          docker compose config --quiet

  build-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend runtime target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/docker/backend.Dockerfile
          target: runtime
          push: false
          load: true
          tags: ayad-network-manager:ci
      - name: Build Prisma migration target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/docker/backend.Dockerfile
          target: migration
          push: false
          load: true
          tags: ayad-network-manager-migrate:ci
      - name: Report built image sizes
        run: |
          docker image inspect ayad-network-manager:ci ayad-network-manager-migrate:ci --format '{{.RepoTags}}: {{.Size}} bytes' 
