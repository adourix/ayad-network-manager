name: Docker Image CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-install.sh"
      - "install.sh"
      - "scripts/**"
      - "backend/deploy/systemd/ayadnm-docker.service"
      - ".env.docker.example"
      - "README.md"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"
  push:
    branches: [main, feat/docker-setup-installer]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-install.sh"
      - "install.sh"
      - "scripts/**"
      - "backend/deploy/systemd/ayadnm-docker.service"
      - ".env.docker.example"
      - "README.md"
      - ".dockerignore"
      - ".github/workflows/docker-ci.yml"

jobs:
  tests-and-syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check installer and reset script syntax
        run: |
          bash -n install.sh
          bash -n docker-install.sh
          bash -n backend/deploy/bare-metal/install.sh
          bash -n scripts/docker-reset.sh
      - name: Validate Compose configuration
        run: |
          cp .env.docker.example .env
          cp .env.docker.example backend/.env
          docker compose config --quiet
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies and run tests
        working-directory: backend
        run: npm ci && npm test

  build-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend runtime target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/docker/backend.Dockerfile
          target: runtime
          push: false
          load: true
          tags: ayad-network-manager:ci
      - name: Build Prisma migration target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/docker/backend.Dockerfile
          target: migration
          push: false
          load: true
          tags: ayad-network-manager-migrate:ci
      - name: Build enforcement image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/enforcement/Dockerfile
          push: false
          load: true
          tags: ayad-network-manager-enforcement:ci
      - name: Report built image sizes
        run: |
          docker image inspect ayad-network-manager:ci ayad-network-manager-migrate:ci ayad-network-manager-enforcement:ci --format '{{.RepoTags}}: {{.Size}} bytes'