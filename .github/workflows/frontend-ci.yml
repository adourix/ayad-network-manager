name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docker-compose.yml"
      - "backend/deploy/docker/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docker-compose.yml"
      - "backend/deploy/docker/**"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability report
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r=require("./npm-audit.json"); const v=r.vulnerabilities||{}; for(const [name,x] of Object.entries(v)) console.log(name+" | "+x.severity+" | fix="+JSON.stringify(x.fixAvailable)+" | "+(x.via||[]).map(y=>typeof y==="string"?y:y.title).join("; ")); console.log("Totals:",JSON.stringify(r.metadata?.vulnerabilities||{}))'
        continue-on-error: true

      - name: Build
        run: npm run build
