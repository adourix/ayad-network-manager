name: repair-enforcement-agent
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore drain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/infrastructure/enforcement/EnforcementAgent.ts')
          text = p.read_text()
          marker = 'function schedule(job: Job, isBackground: boolean): void {'
          drain = 'async function drain(): Promise<void> { if (running) return; running = true; try { while (priority.length || background.length) { const job = priority.shift() ?? background.shift(); if (job) await job(); } } finally { running = false; } }\n'
          if 'async function drain(): Promise<void>' in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('schedule marker not found')
          text = text.replace(marker, drain + marker, 1)
          p.write_text(text)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add backend/src/infrastructure/enforcement/EnforcementAgent.ts
          git commit -m 'fix(enforcement): restore request queue drain'
          git push
